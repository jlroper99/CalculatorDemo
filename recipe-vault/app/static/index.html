<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Vault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">🍲 <span>Recipe Vault</span></a>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <input id="search" type="search" placeholder="Search recipes, ingredients, tags…  (try: chicken -mushroom, ingredient:basil)" aria-label="Search recipes">
      <ul id="suggestions" class="suggestions" hidden></ul>
    </form>
    <nav class="nav">
      <a href="#/" data-nav="recipes">Recipes</a>
      <a href="#/import" data-nav="import">Import</a>
      <a href="#/inbox" data-nav="inbox">Inbox <span id="inbox-badge" class="badge" hidden></span></a>
      <a href="#/new" class="button primary small">+ New</a>
    </nav>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
