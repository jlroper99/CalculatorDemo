<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liahona · Listen &amp; read the Book of Mormon</title>
  <meta name="description" content="Listen to the Book of Mormon while the text highlights and scrolls with the narration. AI chapter insights and an insight heatmap.">
  <meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="library">
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Liahona home">
      <img src="favicon.svg" alt="" width="28" height="28"><span>Liahona</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="library">Library</a>
      <a href="#/heatmap" data-nav="heatmap">Heatmap</a>
      <a href="#/saved" data-nav="saved">Saved</a>
    </nav>
    <form id="searchForm" class="search-form" role="search">
      <input id="searchInput" type="search" placeholder="Search scriptures" aria-label="Search scriptures">
    </form>
    <button id="themeBtn" class="icon-btn" aria-label="Change theme" title="Theme">◐</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="player" class="player" hidden>
    <div class="progress" id="progress" role="slider" aria-label="Position in chapter" tabindex="0"><span></span></div>
    <div class="player-row">
      <div class="now">
        <strong id="playerTitle"></strong>
        <span id="playerSub" class="muted"></span>
      </div>
      <div class="transport">
        <button id="prevVerse" class="icon-btn" aria-label="Previous verse">⏮</button>
        <button id="playBtn" class="play" aria-label="Play"><span class="i-play">▶</span><span class="i-pause">❚❚</span></button>
        <button id="nextVerse" class="icon-btn" aria-label="Next verse">⏭</button>
      </div>
      <div class="extras">
        <button id="rateBtn" class="chip" aria-label="Playback speed">1×</button>
        <button id="sleepBtn" class="chip" aria-label="Sleep timer" title="Sleep timer">☾</button>
        <button id="insBtn" class="chip accent" aria-label="Toggle insights" title="Insights (i)">✦ Insights</button>
        <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
      </div>
    </div>
    <div class="source-row">
      <fieldset class="seg small">
        <legend class="sr-only">Narration source</legend>
        <label><input type="radio" name="source" value="tts" checked> Voice</label>
        <label><input type="radio" name="source" value="audio"> My recording</label>
      </fieldset>
      <span class="audio-only">
        <label class="chip">Choose audio…<input type="file" id="audioFile" accept="audio/*" hidden></label>
        <span id="audioName" class="muted"></span>
        <button id="calibrateBtn" class="chip" aria-pressed="false" title="Tap verses as they begin to align the recording">⟲ Sync</button>
        <button id="clearSyncBtn" class="chip" title="Clear sync points">Reset sync</button>
      </span>
    </div>
  </div>

  <dialog id="settings">
    <form method="dialog">
      <header><h2>Settings</h2><button class="icon-btn" aria-label="Close">✕</button></header>
      <div class="settings-body"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
